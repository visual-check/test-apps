name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck scripts/*.sh
      # actionlint's release tarball, checked against its published checksum.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 5 -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $tarball" | sha256sum --check --strict
          tar -xzf "$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # visual-check's packages and browser image, from its main branch.
  pack:
    name: Pack
    uses: visual-check/visual-check/.github/workflows/pack.yml@main

  test-apps:
    name: Test apps
    needs: pack
    uses: ./.github/workflows/test-apps.yml
    with:
      artifact: visual-check-packages
